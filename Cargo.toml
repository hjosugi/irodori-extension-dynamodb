[package]
name = "irodori-extension-dynamodb"
version = "0.1.4"
publish = false
edition = "2021"
license = "0BSD"
description = "Native Irodori Table connector extension for DynamoDB."
repository = "https://github.com/irodori-table/irodori-extension-dynamodb"
readme = "README.md"
include = [
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE-*",
  "connector.config.json",
  "connector.source.json",
  "irodori.extension.json",
  "src/**",
  "native/source/**",
]

[lib]
name = "irodori_extension_dynamodb"
crate-type = ["cdylib", "rlib"]

[dependencies]
irodori-connector-abi = { git = "https://github.com/hjosugi/irodori-kit", tag = "v0.7.2" }
aws-config = "1"
aws-credential-types = "1"
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-types = "1"
base64 = "0.22"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.dev.package."*"]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
